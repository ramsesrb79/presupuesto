<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Presupuestos">
<meta name="description" content="Presupuestos de trabajo: eventos, departamentos y proyectos. Tus datos se quedan en tu dispositivo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Presupuestos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: iOS-style app shell. Sidebar on wide screens, translucent tab bar on phones; inset-grouped lists, large titles, bottom sheets. */
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --sheet-bg: #f2f2f7;
    --sheet-card: #ffffff;
    --fill: rgba(120, 120, 128, .12);
    --fill-2: rgba(120, 120, 128, .2);
    --label: #000000;
    --label-2: rgba(60, 60, 67, .6);
    --label-3: rgba(60, 60, 67, .3);
    --sep: rgba(60, 60, 67, .2);
    --bar: rgba(249, 249, 249, .88);
    --seg-on: #ffffff;
    --tint: #007aff;
    --tint-soft: rgba(0, 122, 255, .12);
    --pos: #248a3d;
    --neg: #d70015;
    --c-blue: #007aff; --c-green: #34c759; --c-orange: #ff9500; --c-red: #ff3b30; --c-purple: #af52de;
    --c-pink: #ff2d55; --c-teal: #30b0c7; --c-indigo: #5856d6; --c-brown: #a2845e; --c-gray: #8e8e93;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    --font-d: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    --font-r: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --card: #1c1c1e; --sheet-bg: #1c1c1e; --sheet-card: #2c2c2e;
      --fill: rgba(120, 120, 128, .24); --fill-2: rgba(120, 120, 128, .36);
      --label: #ffffff; --label-2: rgba(235, 235, 245, .6); --label-3: rgba(235, 235, 245, .3); --sep: rgba(84, 84, 88, .65);
      --bar: rgba(22, 22, 24, .88); --seg-on: #636366; --tint: #0a84ff; --tint-soft: rgba(10, 132, 255, .2);
      --pos: #30d158; --neg: #ff453a;
      --c-blue: #0a84ff; --c-green: #30d158; --c-orange: #ff9f0a; --c-red: #ff453a; --c-purple: #bf5af2;
      --c-pink: #ff375f; --c-teal: #40c8e0; --c-indigo: #5e5ce6; --c-brown: #ac8e68; --c-gray: #8e8e93;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --card: #1c1c1e; --sheet-bg: #1c1c1e; --sheet-card: #2c2c2e;
    --fill: rgba(120, 120, 128, .24); --fill-2: rgba(120, 120, 128, .36);
    --label: #ffffff; --label-2: rgba(235, 235, 245, .6); --label-3: rgba(235, 235, 245, .3); --sep: rgba(84, 84, 88, .65);
    --bar: rgba(22, 22, 24, .88); --seg-on: #636366; --tint: #0a84ff; --tint-soft: rgba(10, 132, 255, .2);
    --pos: #30d158; --neg: #ff453a;
    --c-blue: #0a84ff; --c-green: #30d158; --c-orange: #ff9f0a; --c-red: #ff453a; --c-purple: #bf5af2;
    --c-pink: #ff375f; --c-teal: #40c8e0; --c-indigo: #5e5ce6; --c-brown: #ac8e68; --c-gray: #8e8e93;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
  button, a, input, select, label, .row, .tab { touch-action: manipulation; }
  .pad, .tabbar, .nav-i, .btn, .chk { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { background: var(--bg); color: var(--label); font: 17px/1.35 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  h1, h2, h3, p, dl, dd { margin: 0; }
  h1, h2, h3 { text-wrap: balance; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--tint); outline-offset: 2px; border-radius: 6px; }
  .tab-num, .amt, .big, .v, td { font-variant-numeric: tabular-nums; }

  /* Shell */
  .side { display: none; }
  .main { padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
  .content { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 32px; display: grid; gap: 22px; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--sep); padding: 6px max(4px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
  .tab { background: none; border: 0; display: grid; justify-items: center; gap: 2px; color: var(--label-2); font: 500 10px/1.2 var(--font); padding: 4px 0; cursor: pointer; position: relative; }
  .tab svg { width: 26px; height: 26px; }
  .tab.on { color: var(--tint); }
  @media (min-width: 900px) {
    .app { display: grid; grid-template-columns: 250px minmax(0, 1fr); }
    .side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 22px 12px 18px max(12px, env(safe-area-inset-left, 0px)); border-right: .5px solid var(--sep); background: var(--card); }
    .tabbar { display: none; }
    .main { padding-bottom: 0; }
    .content { padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px; }
  }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 20px var(--font-d); padding: 0 10px 16px; }
  .brand-ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: linear-gradient(160deg, #3a9bff, #0060df); color: #fff; font: 700 17px var(--font-r); }
  .nav-i { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; border-radius: 10px; padding: 9px 10px; font: 500 15px var(--font); color: var(--label); cursor: pointer; text-align: left; }
  .nav-i svg { width: 22px; height: 22px; color: var(--tint); }
  .nav-i:hover { background: var(--fill); }
  .nav-i.on { background: var(--tint); color: #fff; }
  .nav-i.on svg { color: #fff; }
  .side .spacer { flex: 1; }
  .dot { position: absolute; top: 2px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--c-orange); }
  .nav-i .dot { position: static; margin-left: auto; }

  /* Headers */
  .vh { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .vh > div:first-child { min-width: 0; display: grid; gap: 2px; flex: 1 1 auto; }
  .eyebrow { font: 600 13px var(--font); color: var(--label-2); text-transform: uppercase; letter-spacing: .02em; }
  .lt { font: 700 34px/1.12 var(--font-d); letter-spacing: .01em; overflow-wrap: anywhere; }
  .sub { color: var(--label-2); font-size: 15px; }
  .vh-act { display: flex; gap: 10px; align-items: center; }
  .sh { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .sh h2 { font: 700 22px var(--font-d); }
  .section { display: grid; gap: 0; min-width: 0; }
  .note { color: var(--label-2); font-size: 13px; padding: 6px 16px 0; }

  /* Buttons */
  .btn { background: var(--tint); color: #fff; border: 0; border-radius: 12px; padding: 13px 20px; font: 600 17px var(--font); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn.small { font-size: 15px; padding: 7px 14px; border-radius: 999px; }
  .btn.tinted { background: var(--tint-soft); color: var(--tint); }
  .btn.block { width: 100%; }
  .btn.destructive { background: var(--card); color: var(--neg); }
  .sheet .btn.destructive { background: var(--sheet-card); }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--tint-soft); color: var(--tint); border: 0; display: grid; place-items: center; cursor: pointer; flex: none; position: relative; }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn .dot { top: 0; right: 0; }
  .link { background: none; border: 0; color: var(--tint); font: 400 17px var(--font); padding: 6px 0; cursor: pointer; }
  .link.strong { font-weight: 600; }
  .link.sm { font-size: 15px; }
  .back { display: inline-flex; align-items: center; gap: 2px; background: none; border: 0; color: var(--tint); font: 400 17px var(--font); padding: 4px 0; cursor: pointer; justify-self: start; }
  .back svg { width: 22px; height: 22px; }

  /* Cards & lists */
  .card { background: var(--card); border-radius: 16px; padding: 16px; min-width: 0; }
  .group { background: var(--card); border-radius: 12px; overflow: hidden; }
  .sheet .group { background: var(--sheet-card); }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 56px; position: relative; width: 100%; background: none; border: 0; text-align: left; cursor: pointer; }
  .row:active { background: var(--fill); }
  .row + .row::before, .row + .frow::before, .frow + .frow::before, .frow + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 60px; border-top: .5px solid var(--sep); }
  .frow + .frow::before, .row.plain + .row::before { left: 16px; }
  .rt { display: grid; gap: 1px; min-width: 0; flex: 1; }
  .t1 { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t2 { font-size: 14px; color: var(--label-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amt { margin-left: auto; font-weight: 500; white-space: nowrap; text-align: right; }
  .amt small { display: block; font-size: 12px; font-weight: 400; color: var(--label-2); }
  .pos { color: var(--pos); }
  .neg { color: var(--neg); }
  .muted { color: var(--label-2); }
  .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 600 15px var(--font); flex: none; background: var(--c, var(--c-gray)); }
  .ic.sq { border-radius: 9px; }
  .tap { cursor: pointer; }
  .kv > div.tap dd::after, .legend > div.tap strong::after { content: '›'; margin-left: 6px; color: var(--label-3); font-weight: 400; }
  .stat.tap .k::after { content: ' ›'; color: var(--label-3); }
  .kv > div.tap:active, .stat.tap:active, .legend > div.tap:active, .big.tap:active { opacity: .6; }
  .row .chev { color: var(--label-3); display: grid; place-items: center; margin-left: 2px; }
  .row .chev svg { width: 14px; height: 14px; }
  .ic.ic-color { background: #eef0f4; }
  .ic.ic-color svg { width: 28px; height: 28px; }
  .sug-i .ic.ic-color svg { width: 22px; height: 22px; }
  .icons-pick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; width: 100%; }
  .icons-pick label { position: relative; display: grid; justify-items: center; gap: 2px; cursor: pointer; }
  .icons-pick input { position: absolute; opacity: 0; pointer-events: none; }
  .icons-pick .ip-ic { width: 44px; height: 44px; border-radius: 50%; background: #eef0f4; display: grid; place-items: center; box-shadow: 0 0 0 2px transparent; transition: box-shadow .15s; }
  .icons-pick .ip-ic svg { width: 30px; height: 30px; }
  .icons-pick label.on .ip-ic { box-shadow: 0 0 0 2.5px var(--tint); }
  .icons-pick .ip-t { font: 500 11px var(--font); color: var(--label-2); }
  .icons-pick label.auto .ip-ic { opacity: .75; }
  .ic svg { width: 20px; height: 20px; }
  .add-row { color: var(--tint); }
  .add-row .ic { background: var(--tint-soft); color: var(--tint); }
  .empty { background: var(--card); border-radius: 16px; padding: 28px 20px; text-align: center; color: var(--label-2); display: grid; gap: 10px; justify-items: center; }
  .empty strong { color: var(--label); font: 600 19px var(--font-d); }
  .empty .btn { margin-top: 4px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { background: var(--card); border-radius: 14px; padding: 13px 15px; min-width: 0; }
  .stat .k { font: 500 13px var(--font); color: var(--label-2); }
  .stat .v { font: 600 22px/1.25 var(--font-r); overflow-wrap: anywhere; }
  .stat .s { font-size: 13px; color: var(--label-2); }
  @media (max-width: 599px) { .stats > .stat:last-child:nth-child(odd) { grid-column: 1 / -1; } }

  .hero { background: var(--card); border-radius: 20px; padding: 20px; display: grid; gap: 10px; }
  .hero .k { font: 600 15px var(--font); color: var(--label-2); }
  .hero .big { font: 700 46px/1.05 var(--font-r); letter-spacing: -.02em; overflow-wrap: anywhere; }
  .hero .hint { color: var(--label-2); }
  .hero .btn { justify-self: start; }
  .kv { display: grid; gap: 8px; margin-top: 6px; padding-top: 12px; border-top: .5px solid var(--sep); }
  .kv div { display: flex; justify-content: space-between; gap: 12px; }
  .kv dt { color: var(--label-2); }
  .kv dd { font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; white-space: nowrap; }

  .bar { height: 8px; border-radius: 99px; background: var(--fill); overflow: hidden; }
  .bar.lg { height: 12px; }
  .bar > i { display: block; height: 100%; border-radius: inherit; background: var(--c, var(--c-blue)); }
  .stack { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--fill); gap: 2px; }
  .stack > i { display: block; height: 100%; background: var(--c); }
  .legend { display: grid; gap: 8px; margin-top: 12px; }
  .legend div { display: flex; align-items: center; gap: 10px; }
  .legend b { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
  .legend span { flex: 1; min-width: 0; }
  .legend em { font-style: normal; color: var(--label-2); font-variant-numeric: tabular-nums; }
  .legend strong { font-weight: 500; font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
  .chart-row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .chart-row .legend { flex: 1 1 180px; margin: 0; }
  .donut { width: 150px; height: 150px; flex: none; }
  .donut .dk { fill: var(--label-2); font: 500 9px var(--font); }
  .donut .dv { fill: var(--label); font: 700 15px var(--font-r); }
  .bars { width: 100%; height: auto; display: block; }
  .pat-hit:focus { outline: none; }
  .pat-hit:focus-visible { outline: 2px solid var(--tint); outline-offset: -1px; }
  .bars text { fill: var(--label-2); font: 500 10px var(--font); }
  .bars line { stroke: var(--sep); stroke-width: .6; }
  .chart-key { display: flex; gap: 16px; font-size: 13px; color: var(--label-2); margin-top: 6px; }
  .chart-key b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 6px; vertical-align: -1px; }

  .mnav { display: flex; align-items: center; justify-content: space-between; background: var(--card); border-radius: 12px; padding: 6px; }
  .mnav strong { font: 600 17px var(--font); }
  .mnav .icon-btn { background: none; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mrow { gap: 6px; padding: 0 16px 0 6px; cursor: default; }
  .mrow:active { background: none; }
  .row + .mrow::before, .mrow + .row::before { left: 52px; }
  .row-main { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; background: none; border: 0; padding: 10px 0; min-height: 56px; text-align: left; cursor: pointer; }
  .row-main:active { opacity: .6; }
  .chk { width: 40px; height: 48px; flex: none; border: 0; background: none; padding: 0; display: grid; place-items: center; cursor: pointer; }
  .chk span { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--label-3); display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s; }
  .chk svg { width: 14px; height: 14px; }
  .chk.on span { background: var(--c-green); border-color: var(--c-green); color: #fff; }
  .frow input.switch { flex: none; width: 51px; height: 31px; padding: 0; border-radius: 99px; background: var(--fill-2); position: relative; cursor: pointer; appearance: none; -webkit-appearance: none; transition: background .2s; }
  .frow input.switch::before { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.08); transition: transform .2s; }
  .frow input.switch:checked { background: var(--c-green); }
  .frow input.switch:checked::before { transform: translateX(20px); }
  .filters select, .filters input { width: 100%; font: 400 16px var(--font); color: var(--label); background: var(--fill); border: 0; border-radius: 10px; padding: 9px 12px; min-width: 0; }
  @media (min-width: 760px) { .filters { grid-template-columns: 1fr 1fr 1fr 1.3fr; } .filters input { grid-column: auto; } }
  .totline { display: flex; gap: 16px; flex-wrap: wrap; font-size: 15px; color: var(--label-2); padding: 0 4px; }
  .totline b { color: var(--label); font-weight: 600; font-variant-numeric: tabular-nums; }
  .day-h { font: 600 13px var(--font); color: var(--label-2); text-transform: uppercase; letter-spacing: .02em; padding: 18px 16px 6px; display: flex; justify-content: space-between; }
  .day-h:first-child { padding-top: 0; }

  .steps { display: grid; gap: 0; }
  .step-ok .ic { background: var(--c-green); }

  .metas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px; }
  .meta { background: var(--card); border-radius: 16px; padding: 14px; border: 0; text-align: left; cursor: pointer; display: flex; gap: 12px; align-items: center; min-width: 0; }
  .meta svg { width: 54px; height: 54px; flex: none; }
  .meta .rt .t2 { white-space: normal; }
  .ring-t { fill: var(--label); font: 700 11px var(--font-r); }
  .guide { display: grid; gap: 6px; margin-top: 14px; padding-top: 12px; border-top: .5px solid var(--sep); font-size: 15px; }
  .guide div { display: flex; justify-content: space-between; gap: 10px; }
  .guide div > span:last-child { white-space: nowrap; }
  .guide .ok { color: var(--pos); }
  .guide .bad { color: var(--neg); }

  .warn-box { background: var(--card); border-radius: 12px; padding: 12px 16px; font-size: 15px; color: var(--label-2); }

  /* Loans */
  .loans { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; }
  .loan { background: var(--card); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
  .chip { justify-self: start; font: 600 12px var(--font); color: var(--tint); background: var(--tint-soft); border-radius: 6px; padding: 3px 8px; }
  .loan h3 { font: 600 20px var(--font-d); overflow-wrap: anywhere; }
  .loan .big { font: 700 30px/1.1 var(--font-r); }
  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
  .facts dt { font-size: 13px; color: var(--label-2); }
  .facts dd { font-weight: 600; font-variant-numeric: tabular-nums; }
  .loan-actions { display: flex; gap: 10px; align-items: center; }
  .loan-actions .btn { flex: 1; }
  .g-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 4px; }
  .g-pct { font: 700 38px/1.1 var(--font-r); color: var(--c-blue); }
  .warn-g .g-pct { color: var(--c-orange); }
  .g-track { position: relative; height: 34px; background: var(--fill); border-radius: 999px; overflow: hidden; margin-top: 12px; }
  .g-fill { height: 100%; width: 0; border-radius: 999px; background: var(--c-blue); transition: width .4s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 12px; color: #fff; font-weight: 600; font-size: 15px; white-space: nowrap; }
  .warn-g .g-fill { background: var(--c-orange); }
  .g-fill.out span { position: absolute; top: 50%; transform: translateY(-50%); left: calc(var(--w) + 10px); color: var(--label); }
  .g-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--label-2); margin-top: 6px; }
  .card h3 { font: 600 20px var(--font-d); }
  .table-scroll { overflow: auto; max-height: 70vh; margin-top: 12px; border-radius: 10px; border: .5px solid var(--sep); }

  const estadoG = (g) => { const pg = pagadoG(g), pe = pendG(g); if (g.total <= 0.005) return { t: 'Sin monto', c: 'muted' }; if (pe <= 0.005) return { t: 'Pagado', c: 'pos' }; if (pg > 0.005) return { t: 'Anticipo ' + money(pg) + ' · faltan ' + money(pe), c: 'warn' }; return { t: 'Por pagar', c: 'warn' }; };
  const fCorta = (f) => parseISO(f).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' }).replace('.', '');
  const fRep = (f) => (f ? parseISO(f).toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '');
  function periodo(p) {

  function vPres(p) {

  }
  function vCategorias(p, r) {

  function renderGastos() {

  // ----- Copias -----
  // Devuelve el texto de la copia (cifrada si se puede), o null si falta crear la contraseña.
  async function armarCopia() {
    const { claveCopia, ...cfg } = S.config;
    const datos = { ...S, config: cfg };
    if (cifradoOk) {
      if (!claveCopia) return null;
      const k = await llaveCopia(), c = await cifrar(k.key, datos);
      return JSON.stringify({ app: 'presupuestos-trabajo', version: 2, fecha: new Date().toISOString(), cifrado: { alg: 'AES-GCM', kdf: 'PBKDF2-SHA256', iter: ITER_COPIA, salt: b64(k.salt), iv: c.iv }, datos: c.ct });
    }
    return JSON.stringify({ app: 'presupuestos-trabajo', version: 1, fecha: new Date().toISOString(), datos }, null, 2);
  }
  async function guardarCopia() {
    if (!hayDatos()) { toast('Todavía no hay datos para guardar.'); return; }
    if (cifradoOk && !S.config.claveCopia) { sheetClaveCopia(true); return; }
    let texto;
    try { texto = await armarCopia(); } catch (e) { toast('No se pudo cifrar la copia.'); return; }
    if (!texto) { toast('No se pudo crear la copia.'); return; }
    if (await bajarArchivo('presupuestos-' + hoyISO() + '.json', texto, 'application/json')) { lsSet('pt_ultima_copia', Date.now()); render(); }
  }
  $('#archivo').addEventListener('change', async (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    let d;
    try { d = JSON.parse(await f.text()); } catch (er) { toast('Ese archivo no es una copia válida.'); return; }
    if (d && d.app === 'mis-finanzas') { toast('Esa copia es de Mis Finanzas, no de Presupuestos.'); return; }
    const aplicar = async (datos) => {
      if (!datos || !Array.isArray(datos.presupuestos)) { toast('Ese archivo no es una copia de Presupuestos.'); return; }
      const n = datos.presupuestos.length;
      if (hayDatos() && !(await confirmar('¿Reemplazar tus datos?', `La copia tiene ${n} ${n === 1 ? 'presupuesto' : 'presupuestos'}${d.fecha ? ' (guardada el ' + fCorta(isoDe(new Date(d.fecha))) + ')' : ''}. Lo que hay ahora en este dispositivo se reemplaza.`, 'Reemplazar'))) return;
      const clave = S.config.claveCopia;
      S = normalizar(datos); if (!S.config.claveCopia) S.config.claveCopia = clave;
      presAbierto = null; lsSet('pt_ultima_copia', Date.now()); guardar(); vista = 'inicio'; render(); toast('Copia abierta');
    };
    if (d && d.app === 'presupuestos-trabajo' && d.cifrado && typeof d.datos === 'string') {
      if (!cifradoOk) { toast('Abre la app desde su dirección web (https) para abrir copias cifradas.'); return; }
      let salt;
      try { salt = unb64(d.cifrado.salt); const iv = unb64(d.cifrado.iv), ct = unb64(d.datos); if (salt.length < 8 || iv.length !== 12 || ct.length < 17) throw new Error('corta'); }
      catch (er) { toast('Esta copia está incompleta o dañada. Prueba con otra copia.'); return; }
      const iter = d.cifrado.iter || ITER_COPIA;
      const una = async (pass) => descifrar(await derivar(pass, salt, iter), d.cifrado.iv, d.datos);
      const probar = async (pass) => {
        const t = pass.trim();
        const vars = [...new Set([pass, t, t.charAt(0).toLowerCase() + t.slice(1), t.charAt(0).toUpperCase() + t.slice(1)])].filter(Boolean);
        for (const v of vars) { try { return await una(v); } catch (er) {} }
        throw new Error('clave');
      };
      if (S.config.claveCopia) { try { aplicar(await una(S.config.claveCopia)); return; } catch (er) {} }
      sheetPedirClave(probar, aplicar, d.fecha);
      return;
    }
    aplicar(d && d.app === 'presupuestos-trabajo' ? d.datos : d);
  });

  // ----- PDF -----
  function pdfReporte(p) {
    const D = datosReporte(p), r = D.r, T = TIPOS[p.tipo];
    const PW = 612, PH = 792, M = 44, X1 = PW - M, W = X1 - M;
    const paginas = []; let ops = [], y = 0;
    const nueva = () => { if (ops.length) paginas.push(ops); ops = []; y = PH - M; };
    const T_ = (x, str, size, bold, gris) => { ops.push(`${gris != null ? gris.toFixed(2) + ' g ' : ''}BT /${bold ? 'F2' : 'F1'} ${size} Tf ${x.toFixed(1)} ${y.toFixed(1)} Td (${latin1(str)}) Tj ET${gris != null ? ' 0 g' : ''}`); };
    const TR = (xr, str, size, bold, gris) => T_(xr - anchoPDF(String(str).replace(/−/g, '-'), size), str, size, bold, gris);
    const linea = (x1, y1, x2, y2, gris, ancho) => ops.push(`${ancho ? ancho + ' w ' : ''}${gris != null ? gris.toFixed(2) + ' G ' : ''}${x1.toFixed(1)} ${y1.toFixed(1)} m ${x2.toFixed(1)} ${y2.toFixed(1)} l S${gris != null ? ' 0 G' : ''}${ancho ? ' 1 w' : ''}`);
    const caja = (x, yy, w, h, gris) => ops.push(`${gris.toFixed(3)} g ${x.toFixed(1)} ${yy.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)} re f 0 g`);
    const espacio = (h, alNuevo) => { if (y - h < M + 20) { nueva(); if (alNuevo) alNuevo(); } };
    const titulo = (t) => { espacio(60); y -= 8; T_(M, t, 12.5, true); y -= 6; linea(M, y, X1, y, 0.2, 1.2); y -= 15; };
    // Tabla genérica: cols = [{t, w, a:'r'|'l'}]
    const tabla = (cols, filas, opt = {}) => {
      const xs = []; let x = M; cols.forEach((c) => { xs.push(x); x += c.w; });
      const enc = () => { caja(M, y - 4, W, 15, 0.92); cols.forEach((c, i) => { if (c.a === 'r') TR(xs[i] + c.w - 4, c.t, 8, true); else T_(xs[i] + 4, c.t, 8, true); }); y -= 15; };
      espacio(40); enc();
      filas.forEach((f) => {
        espacio(14, enc);
        if (f.sub) { caja(M, y - 4, W, 14, 0.965); }
        f.v.forEach((v, i) => { if (v == null || v === '') return; const c = cols[i], bold = !!(f.bold || f.sub); let w = c.w; if (c.a !== 'r') for (let j = i + 1; j < cols.length && (f.v[j] == null || f.v[j] === '') && cols[j].a !== 'r'; j++) w += cols[j].w; const s = c.a === 'r' ? String(v) : fitPDF(String(v), w - 8, 8.5); if (c.a === 'r') TR(xs[i] + c.w - 4, s, 8.5, bold, f.gris); else T_(xs[i] + 4, s, 8.5, bold, f.gris); });
        if (f.lineaArriba) linea(M, y + 10, X1, y + 10, 0.55);
        y -= 13.5;
      });
      if (!filas.length) { T_(M + 4, opt.vacio || 'Sin datos.', 8.5, false, 0.45); y -= 13.5; }
      y -= 8;
    };
    nueva();
    // Encabezado
    caja(0, PH - 6, PW, 6, 0.2);
    if (S.config.empresa) { T_(M, S.config.empresa, 9.5, true, 0.4); y -= 20; }
    T_(M, p.nombre, 20, true); y -= 16;
    T_(M, ['Reporte de presupuesto', T.n, periodo(p)].filter(Boolean).join(' · '), 9.5, false, 0.35); y -= 12;

      ['[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${hojas.map((h, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`],
      ['_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`],
      ['docProps/core.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${xesc(p.nombre)}</dc:title><dc:creator>Presupuestos</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().slice(0, 19)}Z</dcterms:created></cp:coreProperties>`],
      ['xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>${hojas.map((h, i) => `<sheet name="${xesc(h[0])}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets><definedNames>${hojas.map((h, i) => { const m = h[1].match(/<autoFilter ref="([A-Z]+)(\d+):([A-Z]+)(\d+)"/); return m ? `<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${h[0]}'!$${m[1]}$${m[2]}:$${m[3]}$${m[4]}</definedName>` : ''; }).join('')}</definedNames><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`],
      ['xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${hojas.map((h, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${hojas.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
      ['xl/styles.xml', styles],
      ...hojas.map((h, i) => [`xl/worksheets/sheet${i + 1}.xml`, h[1]])
    ];
    return zip(archivos);
  }

  // ================= Acciones =================
  const ACC = {
    'tab': (t) => ir(t.dataset.v),
    'cerrar-sheet': () => cerrarSheet(),
    'nuevo-pres': () => sheetPres(null),
    'editar-pres': (t) => sheetPres(t.dataset.id),
    'abrir-pres': (t) => abrirPres(t.dataset.id),
    'cerrar-pres': () => { presAbierto = null; render(); window.scrollTo(0, 0); },
    'ver-arch': () => { verArchivados = !verArchivados; render(); },
    'sub': (t) => { sub = t.dataset.v; render(); },
    'ver-cat': (t) => verGastos({ cat: t.dataset.id }),
    'ver-prov': (t) => verGastos({ q: t.dataset.q }),
    'ver-por-pagar': () => verGastos({ estado: 'pend' }),
    'ver-reemb': () => verGastos({ estado: 'reemb' }),
    'limpiar': () => verGastos({}),
    'cats': () => sheetCats(),
    'editar-cat': (t) => sheetCat(t.dataset.id || null),
    'nuevo-gasto': () => sheetGasto(null, { cat: sub === 'gastos' ? filtro.cat : '' }),
    'ver-gasto': (t) => sheetVerGasto(t.dataset.id),
    'editar-gasto': (t) => sheetGasto(t.dataset.id),
    'nuevo-pago': (t) => sheetPago(t.dataset.g, null),
    'editar-pago': (t) => sheetPago(t.dataset.g, t.dataset.x),
    'reembolsar': (t) => { const g = S.gastos.find((y) => y.id === t.dataset.g); const x = g && g.pagos.find((y) => y.id === t.dataset.x); if (!x) return; x.reembolsado = true; guardar(); render(); toast('Marcado como reembolsado'); },
    'nuevo-metodo': () => sheetMetodo(null),
    'editar-metodo': (t) => sheetMetodo(t.dataset.id),
    'guardar-copia': () => guardarCopia(),
    'pin-cambiar': () => sheetPin('cambiar'),
    'bloquear-ahora': () => bloquearAhora(),
    'clave-copia': () => sheetClaveCopia(false),
    'ver-clave': () => sheetVerClave(),
    'abrir-copia': () => $('#archivo').click(),
    'borrar-todo': async () => {
      if (!(await confirmar('¿Borrar todo?', 'Se borran todos los presupuestos, gastos y pagos de este dispositivo. Guarda una copia antes si la vas a necesitar.', 'Borrar todo'))) return;
      S = normalizar({}); presAbierto = null; guardar(); render(); toast('Datos borrados');
    },
    'reporte': (t) => sheetReporte(t.dataset.id),
    'rep-pdf': async (t) => { const p = pres(t.dataset.id); if (!p) return; try { const bytes = pdfReporte(p); await bajarArchivo(nombreArchivo(p, 'pdf'), bytes, 'application/pdf'); } catch (e) { console.error(e); toast('No se pudo crear el PDF.'); } },
    'rep-xlsx': async (t) => { const p = pres(t.dataset.id); if (!p) return; try { const bytes = xlsxReporte(p); await bajarArchivo(nombreArchivo(p, 'xlsx'), bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); } catch (e) { console.error(e); toast('No se pudo crear el Excel.'); } }
  };
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const f = ACC[t.dataset.act];
    if (f) f(t, e);
  });
  $('#sheet').addEventListener('click', (e) => { if (e.target === $('#sheet')) cerrarSheet(); });
  $('#confirm').addEventListener('click', (e) => { if (e.target === $('#confirm')) cerrarC(false); });
  document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if (!$('#confirm').hidden) cerrarC(false); else if (!$('#sheet').hidden) cerrarSheet(); });
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VISTAS[v] && v !== vista) { vista = v; render(); } });
  // Montos tipo caja registradora: cada dígito entra por la derecha (2 → 0.02, 20 → 0.20, 2056 → 20.56)
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (!(t.matches && t.matches('input.money'))) return;
    const neg = t.classList.contains('signed') && t.value.includes('-');
    const dig = t.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 11);
    if (!dig) { t.value = neg ? '-' : ''; return; }
    t.value = (neg ? '-' : '') + fmtNum(parseInt(dig, 10) / 100);
    try { t.setSelectionRange(t.value.length, t.value.length); } catch (er) {}
  });
  // Cada dígito entra por la derecha sin importar dónde esté el cursor; borrar quita el último
  document.addEventListener('beforeinput', (e) => {
    const t = e.target;
    if (!(t.matches && t.matches('input.money'))) return;
    const it = e.inputType || '';
    const firma = t.classList.contains('signed');
    let neg = firma && t.value.includes('-');
    let dig = t.value.replace(/\D/g, '').replace(/^0+/, '');
    const todo = t.value.length > 0 && t.selectionStart === 0 && t.selectionEnd === t.value.length;
    if (it === 'insertText' || it === 'insertReplacementText' || it === 'insertCompositionText') {
      const d = e.data || '';
      e.preventDefault();
      if (firma && d.includes('-')) neg = !neg;
      const nd = d.replace(/\D/g, '');
      if (todo) { dig = ''; if (!d.includes('-')) neg = false; }
      dig = (dig + nd).replace(/^0+/, '').slice(0, 11);
    } else if (it.startsWith('delete')) {
      e.preventDefault();
      if (todo) { dig = ''; neg = false; } else if (dig) dig = dig.slice(0, -1); else neg = false;
    } else return;
    t.value = dig ? (neg ? '-' : '') + fmtNum(parseInt(dig, 10) / 100) : (neg ? '-' : '');
    try { t.setSelectionRange(t.value.length, t.value.length); } catch (er) {}
    t.dispatchEvent(new Event('input', { bubbles: true }));
  });
  document.addEventListener('pointerup', (e) => {
    const t = e.target;
    if (t.matches && t.matches('input.money')) setTimeout(() => { try { if (t.selectionStart === t.selectionEnd) t.setSelectionRange(t.value.length, t.value.length); } catch (er) {} }, 0);
  });
  document.addEventListener('paste', (e) => {
    const t = e.target;
    if (!(t.matches && t.matches('input.money'))) return;
    const v = parseMonto((e.clipboardData || window.clipboardData).getData('text'));
    if (isNaN(v)) return;
    e.preventDefault();
    t.value = (t.classList.contains('signed') && v < 0 ? '-' : '') + fmtNum(Math.abs(v));
    t.dispatchEvent(new Event('input', { bubbles: true }));
  });
  document.addEventListener('focusin', (e) => {
    const t = e.target;
    if (t.matches && t.matches('input.money')) setTimeout(() => { try { if (document.activeElement === t && t.selectionStart === t.selectionEnd) t.setSelectionRange(t.value.length, t.value.length); } catch (er) {} }, 0);
  });
  document.addEventListener('focusout', (e) => {
    const t = e.target;
    if (!(t.matches && t.matches('input.money')) || t.classList.contains('abono')) return;
    if (t.value.trim() === '') return;
    const v = parseMonto(t.value); t.value = isNaN(v) ? '' : fmtNum(v);
  });
  // Sin zoom: evita el pellizco y el doble toque en iPhone/iPad
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
  let ultimoToque = 0;
  document.addEventListener('touchend', (e) => { const ahora = Date.now(); if (ahora - ultimoToque < 350 && !e.target.closest('input, select, textarea, button, a, label')) e.preventDefault(); ultimoToque = ahora; }, { passive: false });
  document.addEventListener('touchmove', (e) => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });


  // ================= Inicio =================
  (async () => {
    const h = location.hash.slice(1); if (VISTAS[h]) vista = h;
    let est;
    try { est = await cargar(); } catch (e) { S = normalizar(lsGet('presupuestos_estado') || {}); }
    if (cifradoOk) await revisarBio();
    if (est === 'bloqueada') mostrarLock(); else render();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  })();
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
